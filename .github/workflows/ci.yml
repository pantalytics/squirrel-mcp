name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Ruff
        run: .venv/bin/ruff check squirrel_mcp scripts tests
      - name: Type check
        run: .venv/bin/ty check
      - name: Unit tests
        run: .venv/bin/pytest -m "not integration" -q

  integration-greenmail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Start GreenMail
        run: docker compose -f docker-compose.test.yml up -d greenmail
      - name: Integration e2e (real IMAP/SMTP)
        run: .venv/bin/pytest -m integration -q
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  docker-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build + start full stack (GreenMail + Squirrel http)
        run: docker compose -f docker-compose.test.yml up -d --build
      - name: Wait for the MCP server
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null -X POST http://localhost:8000/mcp \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -d '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'; then
              echo "up"; break; fi
            sleep 2
          done
      - name: Docker smoke test (MCP handshake + tool call)
        run: python scripts/mcp_smoke.py
      - name: Playwright browser e2e
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
